# Serverless data engine. Every 10 minutes GitHub Actions collects from all
# sources, commits the history (data/store) to main, and force-pushes the
# freshly built state.json to the single-commit `live` branch. The Vercel site
# proxies /live/state.json to that file, so no server and no GitHub Pages needed.
name: monitor

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay scheduled runs under load
  workflow_dispatch:
    inputs:
      force:
        description: 'Run every source now'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['src/**', 'server/**', 'package*.json']

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Always work on main, whichever branch the schedule fires from.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Collect
        if: github.event_name != 'push'
        run: npm run collect -- ${{ inputs.force && '--force' || '' }}

      - name: Commit history to main
        if: github.event_name != 'push'
        run: |
          git config user.name "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add data/store
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: collection $(date -u +%Y-%m-%dT%H:%MZ)" -q
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((2**i)); done
          exit 1

      - name: Publish live state
        if: github.event_name != 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/live" && cp public/data/state.json "$RUNNER_TEMP/live/state.json"
          cd "$RUNNER_TEMP/live"
          git init -q -b live
          git config user.name "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          # The live branch holds data only; tell Vercel never to build it.
          echo '{ "git": { "deploymentEnabled": false }, "ignoreCommand": "exit 0" }' > vercel.json
          git add state.json vercel.json && git commit -qm "live state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live

      - name: Check build
        if: github.event_name == 'push'
        run: npm run build
