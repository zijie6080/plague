# Serverless data engine.
# One job collects every 10 minutes for ~6 hours (GitHub throttles frequent
# cron schedules, so a single long job is far more regular), commits history to
# main and force-pushes state.json to the single-commit `live` branch that the
# Vercel site proxies. When the loop ends the workflow re-dispatches itself; the
# hourly schedule is only a safety net in case that chain ever breaks.
name: monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run every source now on the first round'
        type: boolean
        default: false
      loops:
        description: 'Rounds (10 min each)'
        default: '34'
  push:
    branches: [main]
    paths: ['src/**', 'server/**', 'package*.json']

permissions:
  contents: write
  actions: write

concurrency:
  group: monitor-${{ github.event_name == 'push' && 'check' || 'collect' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # Always work on main, whichever branch the schedule fires from.
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Collect every 10 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          LOOPS: ${{ inputs.loops || (github.event_name == 'schedule' && '1') || '34' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: scripts/ci-loop.sh
      # Keep the chain going. A scheduled safety-net run only does one round
      # and re-dispatches only if no long run is already queued or running.
      - name: Re-dispatch
        if: success() || failure()   # a manual cancel stops the chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          running=$(gh run list --workflow monitor.yml --event workflow_dispatch --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$running" = "0" ]; then
            gh workflow run monitor.yml --ref main -f loops=34
          fi
